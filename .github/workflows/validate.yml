# Data gates + house-rule invariants.
#
# This repo had eleven validate_*.py scripts and nothing that ran any of them, so a data
# regression could only be caught by whoever happened to run the right script by hand. The
# generator's correctness lives almost entirely in its JSON, which makes these the real tests.
#
# The invariant sweep is trimmed here (two levels, one seed) because the full default is 825
# generations. Run it unabridged locally before a release:
#     C:\Python310\python.exe Backend/scripts/test_house_invariants.py
name: validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Every Backend/scripts/validate_*.py, discovered by glob -- a new gate is covered the
      # moment it is added, with nothing to register here.
      - name: Data validators
        run: python Backend/scripts/validate_all.py

      - name: House-rule invariants (trimmed sweep)
        run: python Backend/scripts/test_house_invariants.py --levels 1,20 --seeds 1

      # The generated files must match what their builders produce. A hand-edit to a generated
      # file survives review far too easily otherwise; the fix is always to edit the overrides.
      - name: Generated files are current
        run: |
          python Backend/scripts/build_companion_archetypes.py
          git diff --exit-code --stat Backend/json/companion_archetypes.json \
            || (echo "::error::companion_archetypes.json is stale -- re-run build_companion_archetypes.py" && exit 1)
