# Data gates + regression tests.
#
# This repo had eleven validate_*.py scripts and nothing that ran any of them, so a data
# regression could only be caught by whoever happened to run the right script by hand. The
# generator's correctness lives almost entirely in its JSON, which makes these the real tests.
#
# The test family was one step further along the same road: eleven test_*.py scripts, of which
# this workflow ran exactly one. The expensive omission was test_golden_payload.py -- seven seeded
# characters with every payload key diffed byte for byte, which is the only thing standing between
# a "pure move" refactor and a quietly different character. Both families now run by glob.
#
# test_all.py trims the full-roster sweeps (see its TRIMMED table) and says so in its summary.
# Run everything unabridged locally before a release:
#     C:\Python310\python.exe Backend/scripts/test_all.py --full
name: validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Every Backend/scripts/validate_*.py, discovered by glob -- a new gate is covered the
      # moment it is added, with nothing to register here.
      - name: Data validators
        run: python Backend/scripts/validate_all.py

      # Every Backend/scripts/test_*.py, same glob discovery. Includes the golden-payload
      # fixtures, which the phase-extraction work depends on: a refactor that changes a payload
      # must fail here, not months later on a character sheet.
      - name: Regression tests
        run: python Backend/scripts/test_all.py

      # The generated files must match what their builders produce. A hand-edit to a generated
      # file survives review far too easily otherwise; the fix is always to edit the overrides.
      - name: Generated files are current
        run: |
          python Backend/scripts/build/build_companion_archetypes.py
          git diff --exit-code --stat Backend/json/companion_archetypes.json \
            || (echo "::error::companion_archetypes.json is stale -- re-run build_companion_archetypes.py" && exit 1)
